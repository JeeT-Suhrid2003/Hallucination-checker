apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-app
  labels:
    app: hello-world
spec:
  replicas: 2
  # 👇 HALLUCINATED KEY: AI invented 'autoHealing' (Not a real K8s Deployment spec field)
  # autoHealing: true 
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      # 👇 HALLUCINATED KEY: AI wrote 'restart_policy' (Docker syntax) instead of 'restartPolicy'
      # restart_policy: Always 
      containers:
      - name: web
        image: hello-world-app:v1
        ports:
        - containerPort: 80
