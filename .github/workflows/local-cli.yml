name: Local AI-DevOps Gateway Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-dryrun:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pyyaml requests

      - name: Run AI Hallucination Detector (Kubernetes manifest)
        shell: bash
        run: |
          echo "🔍 [STAGE 1] Running Python Hallucination Checker on deployment.yml..."
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not set; skipping checker and defaulting to recheck"
            echo "Recommendation: recheck"
            exit 0
          fi

          python checker.py deployment.yml --report hallucination_report.json
          python - <<'PY'
          import json
          import os
          import sys

          report_path = "hallucination_report.json"
          if not os.path.exists(report_path):
              print("No report generated.")
              sys.exit(0)

          with open(report_path, encoding="utf-8") as handle:
              data = json.load(handle)

          for item in data:
              rec = item.get("recommendation", "recheck")
              print(f"File: {item.get('file', 'unknown')} -> {rec}")

          if any(item.get("recommendation") == "do_not_pass" for item in data):
              print("Overall recommendation: do_not_pass")
              sys.exit(1)

          print("Overall recommendation: pass")
          PY

      - name: Execute Kubernetes Dry-Run Against Cluster
        shell: bash
        run: |
          echo "☸️ [STAGE 2] Running Kubernetes dry-run validation against cluster..."
          
          # Configure kubectl with cluster credentials
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config
          
          # Run dry-run against the actual cluster (not just syntax check)
          if kubectl apply -f deployment.yml --dry-run=server --validate=true; then
            echo "✅ Manifest is valid and can be deployed"
          else
            echo "❌ Manifest validation failed - see errors above"
            exit 1
          fi

      - name: Execute Docker Build Dry-Run
        shell: bash
        run: |
          echo "🐳 [STAGE 3] Attempting real Docker build (no AI, no push)..."
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker is not available in this environment; skipping Docker build test"
            exit 0
          fi

          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile found at repo root; skipping."
            exit 0
          fi

          # Actually build the image locally (never pushed anywhere) so we get a
          # real pass/fail: base image pulls, RUN steps, COPY paths, etc. all
          # have to genuinely succeed for this to pass. No API calls involved.
          if docker build -t local-dryrun-image -f Dockerfile .; then
            echo "✅ Docker image built successfully — this Dockerfile can deploy."
          else
            echo "❌ Docker build failed — this Dockerfile cannot deploy as-is."
            exit 1
          fi
